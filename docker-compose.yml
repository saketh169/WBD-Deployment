services:
  # ── Backend API Server ──
  backend:
    build: ./backend
    container_name: wbd-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - MONGODB_URL=${MONGODB_URL}
      - REDIS_URL=${REDIS_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000,http://localhost:80}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - USDA_API_KEY=${USDA_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_SIGNIN_KEY=${ADMIN_SIGNIN_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - wbd-network

  # ── Frontend (React + Nginx) ──
  frontend:
    build: ./frontend
    container_name: wbd-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:5000}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - wbd-network

  # ── Swagger UI ──
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: wbd-swagger
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_JSON=/swagger.json
      - URL=http://localhost:5000/api-docs
      - URLS=[{"url":"http://localhost:5000/api-docs","name":"WBD API"}]
    volumes:
      - ./backend/swagger.json:/swagger.json:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - wbd-network

networks:
  wbd-network:
    driver: bridge
